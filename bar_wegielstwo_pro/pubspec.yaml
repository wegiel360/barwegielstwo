name: bar_wegielstwo_pro
description: "Bar Węgielstwo Pro - launcher dla aplikacji restaurantowych"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '^3.11.5'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.1
  audioplayers: ^5.2.1
  qr_flutter: ^4.1.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/