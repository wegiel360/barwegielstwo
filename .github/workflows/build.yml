name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Installer (Board)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: bar_wegielstwo_board
      - run: flutter build windows --release
        working-directory: bar_wegielstwo_board
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DRootDir=$env:GITHUB_WORKSPACE" "installer\bar_wegielstwo.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/BarWegielstwo-Board-Setup-*.exe

  build-linux:
    name: Build Linux Bundle (Board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
        working-directory: bar_wegielstwo_board
      - run: flutter build linux --release
        working-directory: bar_wegielstwo_board
      - name: Copy bundle
        run: |
          mkdir -p linux-bundle
          cp -r bar_wegielstwo_board/build/linux/x64/release/bundle/* linux-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: linux-bundle/

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Generate QR code
        run: |
          pip install qrcode[pil]
          python -c "import qrcode; img = qrcode.make('https://wegiel.pythonanywhere.com/'); img.save('github_releases_qr.png')"
      - name: Compress Linux bundle
        run: tar czf linux-bundle.tar.gz linux-bundle/
      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            windows-installer/BarWegielstwo-Board-Setup-*.exe
            linux-bundle.tar.gz
            github_releases_qr.png
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Bar Węgielstwo ${{ github.ref_name }}

            ### Platformy
            - **Windows**: BarWegielstwo-Board-Setup — instalator tablicy zamówień
            - **Linux**: bundle (tar.gz) — uruchom ./bar_wegielstwo_board
            - **Android**: przejdź na https://wegiel.pythonanywhere.com/ — zamów w przeglądarce

            ### Strona WWW (Flask)
            - **/** — zamów w przeglądarce
            - **/manage** — panel zarządzania

            ### Użycie
            - F11 — przełącz pełny ekran (aplikacja Board)
            - Backend wymaga firebase-service-account.json do Firebase
