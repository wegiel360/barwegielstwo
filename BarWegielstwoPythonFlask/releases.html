<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Węgielstwo – Pobierz aplikację</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  background: #1a0f0a;
  color: #fff;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 20px;
  text-align: center;
}
.logo { width: 180px; margin-bottom: 20px; border-radius: 12px; }
h1 { font-size: 1.6rem; margin: 0 0 8px; font-weight: 700; }
p.sub { color: #aaa; margin: 0 0 32px; font-size: 0.95rem; }
.buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 14px 24px; border-radius: 12px; font-size: 1rem; font-weight: 600;
  text-decoration: none; transition: transform .15s, box-shadow .15s; border: none; cursor: pointer;
}
.btn:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(0,0,0,.4); }
.btn-android { background: #3ddc84; color: #000; }
.btn-windows { background: #00a4ef; color: #fff; }
.btn-browser { background: #886649; color: #fff; }
.btn svg { width: 22px; height: 22px; flex-shrink: 0; }
.qr-wrap { margin-top: 40px; opacity: .5; }
.qr-wrap img { width: 120px; height: 120px; border-radius: 8px; }
.qr-wrap p { font-size: .75rem; color: #666; margin: 6px 0 0; }
</style>
</head>
<body>
<img class="logo" src="static/BarWegielstwo.png" alt="Bar Węgielstwo">
<h1>Pobierz aplikację<br>albo zamów w przeglądarce!</h1>
<p class="sub">Wybierz swoją platformę</p>

<div class="buttons">
  <a class="btn btn-android" href="/">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    Android (przeglądarka)
  </a>
  <a class="btn btn-windows" href="https://github.com/wegiel360/barwegielstwo/releases/latest/download/BarWegielstwo-Board-Setup-v0.0.2-alpha.exe" target="_blank">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8.4v8.4H3V3zm9.6 0H21v8.4h-8.4V3zM3 12.6h8.4V21H3v-8.4zm9.6 0H21V21h-8.4v-8.4z"/></svg>
    Windows
  </a>
  <a class="btn btn-browser" href="/">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    Przeglądarka
  </a>
</div>

<div class="qr-wrap">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://wegiel.pythonanywhere.com/releases" alt="QR kod">
  <p>Zeskanuj QR, aby wrócić na tę stronę</p>
</div>

<p style="margin-top:32px;font-size:.8rem;color:#555">Bar Węgielstwo &copy; 2026</p>
</body>
</html>
